<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mes projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#080808">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#080808;color:#f0f0f0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #1e1e1e;background:#0f0f0f;flex-wrap:wrap}
.title{font-family:'Rajdhani',sans-serif;font-weight:800;font-size:16px;letter-spacing:3px;color:#888;margin-right:auto}
.pick{display:flex;background:#111;border:1px solid #222;border-radius:999px;padding:3px}
.pick button{border:none;background:none;color:#888;font:600 13px 'Inter',sans-serif;padding:7px 16px;border-radius:999px;cursor:pointer}
.pick button.on{background:var(--c);color:#fff}
.open{font-size:12px;color:#666;text-decoration:none}
.open:hover{color:#aaa}
iframe{flex:1;width:100%;border:none;background:#080808}
</style>
</head>
<body>
<div class="bar">
  <div class="title">MES PROJETS</div>
  <div class="pick" id="pick"></div>
  <a class="open" id="open" target="_blank" rel="noopener">Ouvrir seul ↗</a>
</div>
<iframe id="view" title="Tableau de bord"></iframe>

<script>
// Chaque tableau de bord reste servi par son propre site, avec sa propre
// connexion : Stagely lit la session admin de stagely.fr, Fairy Tails son mot
// de passe /ventes. Cette page ne fait que choisir lequel afficher — aucune
// donnée d'un projet ne transite par l'autre.
const PROJECTS = {
  stagely:    { label: 'Stagely',     url: '/inscrits.html',              color: '#f97316' },
  fairytails: { label: 'Fairy Tails', url: 'https://fairytails.fr/ventes', color: '#8b5cf6' },
};
const KEY = 'projets_choix';

function remembered() {
  const fromHash = location.hash.slice(1);
  if (PROJECTS[fromHash]) return fromHash;
  try { const v = localStorage.getItem(KEY); if (PROJECTS[v]) return v; } catch (e) {}
  return 'stagely';
}

function show(id) {
  const p = PROJECTS[id];
  document.getElementById('view').src = p.url;
  document.getElementById('open').href = p.url;
  document.title = p.label + ' — Mes projets';
  document.querySelectorAll('#pick button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  history.replaceState(null, '', '#' + id);
  try { localStorage.setItem(KEY, id); } catch (e) {}
}

document.getElementById('pick').innerHTML = Object.entries(PROJECTS)
  .map(([id, p]) => `<button type="button" data-id="${id}" style="--c:${p.color}">${p.label}</button>`).join('');
document.querySelectorAll('#pick button').forEach(b => b.addEventListener('click', () => show(b.dataset.id)));
show(remembered());
</script>
</body>
</html>
